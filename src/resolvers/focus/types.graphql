type Query {
    focusBookmarks: [FocusMessage]
    focusCloudItems: [FocusMessage]
    focusBookmarks2: [FocusBookmark]
}
type Mutation {
    createFocusBookmark(message: FocusMessageInput!): String
    removeFocusBookmark(id: String!): [FocusMessage]

    createFocusCloudItem(message: FocusCloudItemInput!): String
    removeFocusCloudItem(id: String!): String
}

type FocusBookmark {
    _id: String
    title: String
    url: String
    shortcut: String
    parent: String
    dir: Boolean
    order: Int
}

type FocusMessage {
    _id: String
    key: String
    title: String
    device: String
    type: String
    machineId: String
    message: String
}

input FocusMessageInput {
    key: String
    title: String
    device: String
    machineId: String
    type: String
    message: String
}

type FocusCloudItem {
    _id: String
    key: String
    title: String
    device: String
    type: String
    machineId: String
    message: String
}

input FocusCloudItemInput {
    key: String
    title: String
    device: String
    machineId: String
    type: String
    message: String
}
